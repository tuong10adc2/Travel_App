plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group 'finaldev.motion_sensors'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace 'finaldev.motion_sensors'
    // Bản vendor gốc ghim compileSdkVersion 28 — quá cũ, thiếu resource
    // android:attr/lStar (thêm ở API 31) mà 1 dependency Material khác merge
    // vào, khiến `flutter build apk --release` lỗi ở bước verifyReleaseResources.
    // Nâng lên khớp compileSdk của app (flutter.compileSdkVersion, hiện = 34).
    compileSdkVersion 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 16
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7"
}
